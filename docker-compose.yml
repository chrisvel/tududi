services:
  tududi:
    image: chrisvel/tududi:latest
    container_name: tududi
    # Requires: cp .env.example .env — see .env.example for all options
    env_file:
      - .env
    volumes:
      - ./tududi_db:/app/db
      - ./uploads:/app/uploads
    ports:
      - "3002:3002"
    restart: unless-stopped
