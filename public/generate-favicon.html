<!DOCTYPE html>
<html>
<head>
    <title>Generate Favicon</title>
</head>
<body>
    <h2>Favicon Generator for Life-to-Day</h2>
    <p>Preview the approved favicon and download a PNG copy:</p>
    
    <canvas id="favicon" width="32" height="32" style="border: 1px solid #ccc; image-rendering: pixelated; width: 160px; height: 160px;"></canvas>
    <br><br>
    
    <button onclick="generateFavicon()">Generate Favicon</button>
    <button onclick="downloadFavicon()">Download as PNG</button>
    
    <script>
        function generateFavicon() {
            const canvas = document.getElementById('favicon');
            const ctx = canvas.getContext('2d');
            
            // LTD-PATCH(T-301): Preview the supplied favicon; never redraw the brand geometry.
            const image = new Image();
            image.onload = () => {
                ctx.clearRect(0, 0, 32, 32);
                ctx.drawImage(image, 0, 0, 32, 32);
            };
            image.src = 'favicon-32.png?v=path-to-today-1';
        }
        
        function downloadFavicon() {
            const canvas = document.getElementById('favicon');
            const link = document.createElement('a');
            link.download = 'favicon.png';
            link.href = canvas.toDataURL();
            link.click();
        }
        
        // Generate on load
        generateFavicon();
    </script>
    
    <p><small>
        The project already includes favicon.ico with multiple sizes. This preview downloads PNG only.
    </small></p>
</body>
</html>
