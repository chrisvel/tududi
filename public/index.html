<!DOCTYPE html>
<!-- LTD-PATCH(T-301): default dir/lang; i18n updates them without a reload -->
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1">
    <base href="/">
    <script>
      (function () {
        function sanitize(value) {
          if (!value) return '';
          var trimmed = value.trim();
          if (!trimmed || trimmed === '/') return '';
          if (trimmed.endsWith('/')) trimmed = trimmed.slice(0, -1);
          if (!trimmed.startsWith('/')) trimmed = '/' + trimmed;
          return trimmed;
        }

        function detectIngress() {
          var match = window.location.pathname.match(/^\/api\/hassio_ingress\/[^/]+/);
          return match ? match[0] : '';
        }

        var envBase = '<%= htmlWebpackPlugin.options.BASE_PATH || "" %>';
        var runtimeBase = sanitize(window.__TUDUDI_BASE_PATH__ || envBase);
        if (!runtimeBase) {
          runtimeBase = sanitize(detectIngress());
        }

        window.__TUDUDI_BASE_PATH__ = runtimeBase;
        var baseHref = runtimeBase ? runtimeBase + '/' : '/';
        var baseTag = document.querySelector('base') || document.createElement('base');
        if (!baseTag.parentNode) {
          document.head.insertBefore(baseTag, document.head.firstChild);
        }
        baseTag.setAttribute('href', baseHref);
      })();
    </script>
    <title>Life-to-Day</title>
    <!-- LTD-PATCH(T-301): Use the shared system UI font; preserve the supplied brand. -->
    <meta name="theme-color" content="#4a5568">
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    
    <!-- Web app manifest for PWA support -->
    <link rel="manifest" href="manifest.json">
    <!-- LTD-PATCH(T-301): static Vazirmatn; webpack must not resolve the font urls -->
    <link rel="stylesheet" href="fonts/vazirmatn/vazirmatn.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
