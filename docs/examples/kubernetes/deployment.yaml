# One replica by default. The schedulers run inside the app process; they take
# advisory locks in PostgreSQL, but a single pod keeps things simple. Recreate
# makes sure the old pod is gone before the new one starts. The database is
# PostgreSQL, reached through DATABASE_URL in the Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tududi
  labels:
    app.kubernetes.io/name: tududi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tududi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tududi
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: tududi
          # Pin a release tag instead of latest so upgrades happen when you
          # choose. Check the release notes before bumping it.
          image: docker.io/chrisvel/tududi:2.0.0
          ports:
            - name: http
              containerPort: 3002
          env:
            - name: TUDUDI_ALLOWED_ORIGINS
              value: https://tududi.example.com
            # Behind an ingress controller there is one proxy hop.
            - name: TUDUDI_TRUST_PROXY
              value: "1"
          envFrom:
            - secretRef:
                name: tududi
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          # The first start runs the migrations, give it a few minutes.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: tududi-uploads
