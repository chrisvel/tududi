# Copy to secret.yaml and fill it in. Don't commit the real values.
# Generate the session secret with: openssl rand -hex 64
apiVersion: v1
kind: Secret
metadata:
  name: tududi
  labels:
    app.kubernetes.io/name: tududi
type: Opaque
stringData:
  TUDUDI_USER_EMAIL: admin@example.com
  TUDUDI_USER_PASSWORD: change-me
  TUDUDI_SESSION_SECRET: change-me
  # Anything else from .env.example can go here too, for example:
  # LLM_API_KEY: sk-...
  # DATABASE_URL: postgres://tududi:secret@postgres:5432/tududi
