version: 2
updates:
  # npm: security updates only (limit 0 turns off routine version bumps).
  # LTD-PATCH(T-201): routine upgrades are reviewed independently; no upstream sync.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
