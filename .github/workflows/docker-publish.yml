name: Publish Docker image

# LTD-PATCH(T-201): publish only this fork's GHCR image. No Docker Hub
# credentials, upstream namespace or external announcements are used.
# Both platforms use native runners; local ARM64 build was verified.

on:
  pull_request:
    branches: [main]
    paths: ['Dockerfile', 'package*.json', '.github/workflows/docker-publish.yml']
  push:
    tags:
      - 'v*'
  # From release.yml: a tag pushed with the workflow's own token raises no
  # push event, so the release workflow calls this one directly.
  workflow_call:
    inputs:
      tag:
        description: Version to publish (e.g. 1.4.3), without the v
        type: string
        required: true
      release:
        description: Also cut the GitHub Release
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: Version to publish (e.g. 1.4.3), without the v
        required: true
      latest:
        description: Also move the latest tag
        type: boolean
        default: false

permissions:
  contents: read

env:
  GH_REPO: DanialMasghati/life-to-day

jobs:
  # Validate the exact publishing architectures before authorizing a tag push.
  # PRs build/scan locally on native runners and never push an image.
  publication-check:
    if: github.event_name == 'pull_request' && github.repository == 'DanialMasghati/life-to-day'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build native release image without publishing
        env:
          PLATFORM: ${{ matrix.platform }}
        run: docker build --platform "$PLATFORM" -t ltd:publication-check .
      - name: Smoke test release dependencies and migration CLI
        run: |
          docker run --rm --entrypoint sh ltd:publication-check -c \
            'cd /app/backend && node -e "require(\"sequelize\"); require(\"sqlite3\"); require(\"express\"); require(\"@modelcontextprotocol/sdk/server/mcp.js\")" && npx --no-install sequelize-cli --version && command -v wget'
      - name: Scan release image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ltd:publication-check
          severity: HIGH,CRITICAL
          exit-code: '1'

  version:
    if: github.event_name != 'pull_request' && github.repository == 'DanialMasghati/life-to-day'
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      latest: ${{ steps.version.outputs.latest }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      release: ${{ steps.version.outputs.release }}

    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_LATEST: ${{ inputs.latest }}
          # Only workflow_call has this input; a manual run leaves it empty.
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            LATEST="true"
            RELEASE="true"
          elif [ "$INPUT_RELEASE" = "true" ]; then
            VERSION="$INPUT_TAG"
            LATEST="true"
            RELEASE="true"
          else
            # A manual republish of a version that already has its release
            VERSION="$INPUT_TAG"
            LATEST="$INPUT_LATEST"
            RELEASE="false"
          fi
          # Only a plain version ever becomes an image tag
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "Refusing to publish: '$VERSION' is not a version" >&2
            exit 1
          fi
          # One rule for both: anything with a hyphen (1.5.0-rc.1,
          # 1.5.0-dev.3) is a pre-release. It never moves the :latest image
          # tag and it is flagged as a pre-release on GitHub.
          PRERELEASE="false"
          case "$VERSION" in
            *-*) LATEST="false"; PRERELEASE="true" ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION (latest: $LATEST, prerelease: $PRERELEASE, release: $RELEASE)"

  # Each platform builds on a runner of its own CPU. Building arm64 under
  # QEMU crashed npm install at random (Illegal instruction) and shipped an
  # arm64 image without its node_modules (#1725).
  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      # Always the tag: a manual run or a call starts on main, and building
      # main under a version's name would replace that version's image.
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: refs/tags/v${{ needs.version.outputs.version }}

      - name: Platform slug
        id: platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "slug=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/danialmasghati/life-to-day,push-by-digest=true,name-canonical=true,push=true
          labels: org.opencontainers.image.source=https://github.com/DanialMasghati/life-to-day
          cache-from: type=gha,scope=${{ steps.platform.outputs.slug }}
          cache-to: type=gha,scope=${{ steps.platform.outputs.slug }},mode=max

      - name: Smoke test the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --rm --entrypoint sh "ghcr.io/danialmasghati/life-to-day@$DIGEST" -c \
            "cd /app/backend && node -e \"require('sequelize'); require('sqlite3'); require('express')\""

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digest-${{ steps.platform.outputs.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Tags are only moved once every platform built, so a version tag never
  # points at a partial image.
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ needs.version.outputs.version }}
      latest: ${{ needs.version.outputs.latest }}
      prerelease: ${{ needs.version.outputs.prerelease }}
      release: ${{ needs.version.outputs.release }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create and push the multi-platform tags
        working-directory: /tmp/digests
        env:
          VERSION: ${{ needs.version.outputs.version }}
          LATEST: ${{ needs.version.outputs.latest }}
        run: |
          # Assemble native build digests within this fork's GHCR namespace.
          set -- -t "ghcr.io/danialmasghati/life-to-day:$VERSION"
          if [ "$LATEST" = "true" ]; then
            set -- "$@" -t ghcr.io/danialmasghati/life-to-day:latest
          fi
          for digest in *; do
            set -- "$@" "ghcr.io/danialmasghati/life-to-day@sha256:$digest"
          done
          docker buildx imagetools create "$@"

      - name: Print digest
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker buildx imagetools inspect "ghcr.io/danialmasghati/life-to-day:$VERSION" | tee -a "$GITHUB_STEP_SUMMARY"

  # The GitHub Release is cut from a tag push or a release.yml call, and only
  # after the image it describes is on GHCR, so a release never points
  # at something nobody can pull. A manual run republishes an image for a tag
  # that already has its release, so it is skipped here.
  release:
    needs: publish
    if: needs.publish.outputs.release == 'true' && needs.publish.outputs.version != '0.0.0-phase2'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: refs/tags/v${{ needs.publish.outputs.version }}
          fetch-depth: 0

      # Every release gets GitHub's generated notes (merged PRs since the
      # previous tag), with the version's CHANGELOG.md section on top when
      # one was written.
      - name: Build release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: ./scripts/release-notes.sh "$VERSION" > release-notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.publish.outputs.version }}
          PRERELEASE: ${{ needs.publish.outputs.prerelease }}
        run: |
          # Re-running the workflow on a tag that already has a release must
          # update it rather than fail the run.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, updating it"
            ACTION=edit
          else
            ACTION=create
          fi
          set -- "$TAG" --title "$TAG" --notes-file release-notes.md
          if [ "$PRERELEASE" = "true" ]; then
            set -- "$@" --prerelease
          else
            set -- "$@" --latest
          fi
          gh release "$ACTION" "$@"
          gh release view "$TAG" --json tagName,isPrerelease,url \
            | tee -a "$GITHUB_STEP_SUMMARY"
