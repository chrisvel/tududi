name: Release

# One button for a release: cuts the version (scripts/create-version.sh),
# publishes the image and the GitHub Release (docker-publish.yml), then asks
# tududi/ci to deploy it to app.tududi.com. There is no approval step after
# this: starting the run, with "deploy" ticked, is the decision to ship.
#
#   Actions → Release → Run workflow, or
#   gh workflow run release -f kind=stable -f bump=fix
#
# Requires the CI_DISPATCH_TOKEN secret (fine-grained token on tududi/ci,
# Contents: read and write) besides the Docker Hub ones docker-publish.yml uses.

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Channel
        type: choice
        options: [stable, rc, dev]
        default: stable
      bump:
        description: 'Version: "next" promotes the rc line (stable) or continues it (rc, dev)'
        type: choice
        options: [fix, minor, major, next]
        default: fix
      version:
        description: Exact version instead (e.g. v1.7.0-rc.2), overrides the two above
        type: string
        required: false
      deploy:
        description: Deploy to app.tududi.com once published (dev releases never deploy)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  cut:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      version: ${{ steps.cut.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Cut the version
        id: cut
        env:
          KIND: ${{ inputs.kind }}
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: |
          if [ -n "$EXACT" ]; then
            VERSION="$EXACT"
          else
            # Shell assignments, the same plan create-version.sh offers
            eval "$(node scripts/version-plan.js)"
            K="${KIND^^}"
            case "$K:$BUMP" in
              STABLE:next) VERSION="$PROMOTE_STABLE" ;;
              RC:next) VERSION="$NEXT_RC" ;;
              DEV:next) VERSION="$NEXT_DEV" ;;
              *) VAR="${K}_${BUMP^^}"; VERSION="${!VAR}" ;;
            esac
          fi
          if [ -z "$VERSION" ]; then
            echo "Nothing to release for $KIND/$BUMP (no rc line to promote?)" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          ./scripts/create-version.sh --no-push "$VERSION"

          # Two pushes, as in create-version.sh. Neither triggers
          # docker-publish.yml (the workflow token raises no events), which
          # is why the next job calls it.
          git push origin HEAD:main
          git push origin "$VERSION"

          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "Released $VERSION" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: cut
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag: ${{ needs.cut.outputs.version }}
    secrets: inherit
    permissions:
      contents: write
      packages: write

  deploy:
    needs: [cut, publish]
    # Stable and rc when ticked, dev never. Decided on the version itself, so
    # an exact version is judged the same way.
    if: >-
      inputs.deploy &&
      (!contains(needs.cut.outputs.version, '-') ||
      contains(needs.cut.outputs.version, '-rc.'))
    runs-on: ubuntu-latest
    # Long enough to sit behind another deploy in tududi/ci's queue
    timeout-minutes: 45

    steps:
      # The deploy runs in tududi/ci. Wait for it so a failed deploy fails
      # this job instead of passing silently. CI_DISPATCH_TOKEN needs
      # Actions: read on tududi/ci for this.
      - name: Deploy through tududi/ci
        env:
          GH_TOKEN: ${{ secrets.CI_DISPATCH_TOKEN }}
          VERSION: ${{ needs.cut.outputs.version }}
          REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh api repos/tududi/ci/dispatches \
            -f event_type=deploy \
            -f "client_payload[version]=$VERSION" \
            -f "client_payload[request_id]=$REQUEST_ID"

          # The deploy is already requested; this only checks we can follow it
          if ! gh run list -R tududi/ci --workflow deploy.yml --limit 1 > /dev/null; then
            echo "::error::CI_DISPATCH_TOKEN cannot read tududi/ci runs (needs Actions: read); the deploy was requested but its result is unknown"
            exit 1
          fi

          # tududi/ci names the run after the request id
          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID=$(gh run list -R tududi/ci --workflow deploy.yml \
              --event repository_dispatch --limit 20 \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle | endswith(\"[$REQUEST_ID]\")) | .databaseId" \
              | head -n 1)
            [ -n "$RUN_ID" ] && break
            sleep 10
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::No tududi/ci deploy run found for request $REQUEST_ID"
            exit 1
          fi

          URL="https://github.com/tududi/ci/actions/runs/$RUN_ID"
          echo "Deploy of $VERSION: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Waiting for $URL"

          while :; do
            STATE=$(gh run view "$RUN_ID" -R tududi/ci \
              --json status,conclusion -q '.status + " " + .conclusion' \
              || true)
            case "$STATE" in
              "completed success") echo "Deployed $VERSION"; break ;;
              completed*)
                echo "::error::Deploy of $VERSION failed (${STATE#completed }): $URL"
                exit 1 ;;
            esac
            sleep 15
          done
