# Life-to-Day single-server deployment: the app image from this fork, behind
# Caddy for automatic HTTPS. Run from this folder:
#
#   cp .env.example .env    # then fill it in
#   docker compose --profile production up -d
# Local builds use docker-compose.local.yml (selected by the example .env).
#
# The root docker-compose.yml still runs the upstream chrisvel/tududi image
# and is left alone. Steps, backup and rollback: deploy/README.md.

x-logging: &logging
    driver: json-file
    options:
        max-size: 10m
        max-file: '3'

services:
    app:
        profiles: [production, local]
        image: ghcr.io/danialmasghati/life-to-day:${LTD_VERSION:-latest}
        # Fixed name prevents Compose from scaling the SQLite writer.
        container_name: life-to-day-app
        env_file: .env
        volumes:
            - ./data/db:/app/db
            - ./data/uploads:/app/uploads
            - ./data/backups:/app/backups
        # No ports: only Caddy reaches the app, over the compose network.
        restart: unless-stopped
        healthcheck:
            # Readiness, not liveness: also checks the database and migrations.
            # The image has busybox wget but no curl.
            test:
                [
                    'CMD',
                    'wget',
                    '-q',
                    '-O',
                    '/dev/null',
                    'http://127.0.0.1:3002/api/health/ready',
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s
        logging: *logging

    caddy:
        profiles: [production]
        image: caddy:2
        depends_on:
            - app
        ports:
            - '80:80'
            - '443:443'
            - '443:443/udp'
        environment:
            LTD_DOMAIN: ${LTD_DOMAIN:-plan.example.com}
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        restart: unless-stopped
        logging: *logging

volumes:
    caddy_data:
    caddy_config:
